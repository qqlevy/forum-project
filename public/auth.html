<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Auth</title>

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
    font-family:Arial;
    color:white;
}

.box {
    text-align:center;
    padding:40px;
    width:320px;
    background:rgba(255,255,255,0.05);

    border-radius:24px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

button {
    display:block;
    width:200px;
    padding:12px;
    margin:10px auto;
    cursor:pointer;
    font-size:16px;

    border-radius:12px;
}

button:hover {
    transform:scale(1.05);
    background:#abffb0;
}
</style>
</head>

<body>

<div class="box">
    <h2>Выберите способ регистрации.</h2>

    <button onclick="goLogin()">Вход</button>
    <button onclick="goRegister()">Регистрация</button>
</div>

<script>
function goLogin() {
    window.location.href = "login.html";
}

function goRegister() {
    window.location.href = "register.html";
}
</script>

</body>
</html>
