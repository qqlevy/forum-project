<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    padding:40px;
}

.box {
    max-width:700px;
    margin:auto;
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:18px;
}

input, select {
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background:#222;
    color:white;
}

.application {
    margin-top:10px;
    padding:14px;
    background:#1c1c1c;
    border-radius:10px;
    line-height:1.6;
}

.status {
    color:#4CAF50;
    font-weight:bold;
}

.reject {
    background:#b83a3a;
}

.reject:hover {
    background:#9f3030;
}

button {
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    margin-top:8px;
}

button:hover {
    background:#45a049;
}

.user {
    margin-top:10px;
    padding:12px;
    background:#1c1c1c;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.role {
    color:#4CAF50;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>Админ панель</h2>

    <button onclick="goForum()">Вернуться на форум</button>

    <h3>Назначить роль</h3>

    <input id="login" placeholder="Логин пользователя">

    <select id="role">
        <option value="user">Пользователь</option>
        <option value="moderator">Модератор</option>
        <option value="admin">Администратор</option>
    </select>

    <button onclick="setRole()">Выдать роль</button>

    <h3>Список пользователей</h3>
    <div id="users"></div>
    <h3>Заявки</h3>
<div id="applications"></div>
</div>

<script>
async function checkAdmin() {
    const res = await fetch("/api/profile", {
        credentials: "include"
    });

    if (res.status === 401) {
        window.location.href = "login.html";
        return;
    }

    const user = await res.json();

    if (user.role !== "admin") {
        alert("Нет доступа");
        window.location.href = "forum.html";
        return;
    }

renderUsers();
renderApplications();
}

async function renderUsers() {
    const res = await fetch("/api/users", {
        credentials: "include"
    });

    if (res.status === 403) {
        alert("Нет доступа");
        window.location.href = "forum.html";
        return;
    }

    const users = await res.json();
    const block = document.getElementById("users");

    block.innerHTML = "";

    users.forEach(u => {
        block.innerHTML += `
            <div class="user">
                <span>${u.login}</span>
                <span class="role">${u.role}</span>
            </div>
        `;
    });
}

async function setRole() {
    const login = document.getElementById("login").value.trim();
    const role = document.getElementById("role").value;

    if (login === "") {
        alert("Введи логин пользователя");
        return;
    }

    const res = await fetch("/api/users/role", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ login, role })
    });

    const data = await res.json();

    alert(data.message || "Роль изменена");

    if (data.success) {
        document.getElementById("login").value = "";
        renderUsers();
    }
}

function goForum() {
    window.location.href = "forum.html";
}

checkAdmin();

async function renderApplications() {
    const res = await fetch("/api/applications", {
        credentials: "include"
    });

    if (res.status === 403) {
        return;
    }

    const applications = await res.json();
    const block = document.getElementById("applications");

    block.innerHTML = "";

    if (applications.length === 0) {
        block.innerHTML = "<p>Заявок пока нет</p>";
        return;
    }

    applications.forEach(app => {
        let statusText = "На рассмотрении";

        if (app.status === "accepted") {
            statusText = "Принята";
        }

        if (app.status === "rejected") {
            statusText = "Отклонена";
        }

        block.innerHTML += `
            <div class="application">
                <b>Пользователь:</b> ${app.user_login}<br>
                <b>RP ник:</b> ${app.nickname}<br>
                <b>Возраст:</b> ${app.age}<br>
                <b>Департамент:</b> ${app.department}<br>
                <b>Опыт RP:</b> ${app.experience}<br>
                <b>Причина:</b> ${app.reason}<br>
                <b>Статус:</b> <span class="status">${statusText}</span><br><br>

                <button onclick="changeApplicationStatus(${app.id}, 'accepted')">
                    Принять
                </button>

                <button class="reject" onclick="changeApplicationStatus(${app.id}, 'rejected')">
                    Отклонить
                </button>
            </div>
        `;
    });
}

async function changeApplicationStatus(id, status) {
    const res = await fetch("/api/applications/status", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id, status })
    });

    const data = await res.json();

    alert(data.message);

    if (data.success) {
        renderApplications();
    }
}

</script>

</body>
</html>
