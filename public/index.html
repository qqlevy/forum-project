<!DOCTYPE html>
<html lang="ru">
<head> <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Test Role Play</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
        }

        .box {
            text-align: center;

            padding: 40px 50px;
            width: 420px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);

            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);

            opacity: 0;
            transform: translateY(25px);
            animation: fadeUp 1s ease-out forwards;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 30px;
            line-height: 1.3;

            opacity: 0;
            transform: translateY(15px);
            animation: fadeUp 1s ease-out forwards;
            animation-delay: 0.3s;
        }

.btn-wrap {
    opacity: 0;
    transform: translateY(15px);
    animation: fadeUp 1s ease-out forwards;
    animation-delay: 0.6s;

    display: inline-block;
}

button {
    padding: 14px 32px;
    font-size: 20px;

    border: none;
    cursor: pointer;
    border-radius: 8px;

    background: #4CAF50;
    color: white;

    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    will-change: transform;
}

button:hover {
    transform: scale(1.08);
    background: #45a049;
    box-shadow: 0 0 18px rgba(0, 255, 120, 0.4);
}

        /* 📌 ПОДПИСЬ ОПУЩЕНА НИЖЕ */
        .footer {
            margin-top: 25px;   /* было меньше — теперь ниже */
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);

            opacity: 0;
            animation: fadeUp 1s ease-out forwards;
            animation-delay: 0.9s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Добро пожаловать на<br>Test Role Play</h1>

    <div class="btn-wrap">
<button onclick="start()">Продолжить</button>

<script>
function start() {
    const sound = document.getElementById("hoverSound");

    sound.currentTime = 0;
    sound.volume = 0.5;

    sound.play().catch(() => {});

    setTimeout(() => {
        window.location.href = "auth.html";
    }, 200);
}
</script>
    </div>

    <div class="footer">Forum by Levy</div>
</div>


<script>
    function continueSite() {
        window.location.href = "forum.php";
    }
</script>

<audio id="hoverSound" src="hover.mp3" preload="auto"></audio>

<script>
const btn = document.querySelector(".btn-wrap button");
const sound = document.getElementById("hoverSound");

// 👇 "разблокировка" звука (обязательно)
document.addEventListener("click", () => {
    sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
    }).catch(() => {});
}, { once: true });

</script>

</body>
</html>
